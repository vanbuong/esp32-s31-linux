%YAML 1.2
---
$id: http://devicetree.org/schemas/net/esp,esp32s31-eth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Espressif ESP32-S31 Gigabit Ethernet IPC netdev

maintainers:
  - Marco Müller <hello@annoyedmilk.ch>

description: >
  The ESP32-S31 RGMII EMAC stays with ESP-IDF firmware on hart 0. Linux
  exchanges Ethernet frames through a fixed shared-memory window in internal
  SRAM and a pair of cross-core doorbell registers.

properties:
  compatible:
    const: esp,esp32s31-eth

  reg:
    items:
      - description: Shared-memory IPC block in internal SRAM
      - description: Cross-core doorbell register pair (FROM_CPU_2/3)

  reg-names:
    items:
      - const: ipc
      - const: doorbell

  interrupts:
    maxItems: 1

  interrupt-parent: true

required:
  - compatible
  - reg
  - reg-names
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    ethernet@2f060000 {
        compatible = "esp,esp32s31-eth";
        reg = <0x2f060000 0x18000>, <0x20586018 0x8>;
        reg-names = "ipc", "doorbell";
        interrupt-parent = <&clic>;
        interrupts = <36 67 IRQ_TYPE_LEVEL_HIGH>;
    };
