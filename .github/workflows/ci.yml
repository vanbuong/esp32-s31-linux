# Build and check both ESP32-S31 board profiles.
name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BR_IMAGE: esp32s31-buildroot:bookworm
  BR_VOLUME: esp32s31-br
  IDF_IMAGE: espressif/idf:v6.1

jobs:
  board-check:
    name: Board config + patch hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate both board profiles
        run: bash scripts/ci-board-check.sh

  kernel-check:
    name: Kernel patches apply (7.1.3)
    runs-on: ubuntu-latest
    needs: board-check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Buildroot host image
        run: docker build -f container/Containerfile -t "$BR_IMAGE" container

      - name: Dry-run the kernel patch series
        run: make kernel-check BOARD=korvo-1

  bootloader:
    name: Bootloader (${{ matrix.board }})
    runs-on: ubuntu-latest
    needs: board-check
    strategy:
      fail-fast: false
      matrix:
        board: [korvo-1, function-coreboard-1, function-coreboard-1-spi-sd]
    steps:
      - uses: actions/checkout@v4

      - name: Map board sdkconfig defaults
        id: board
        run: |
          case "${{ matrix.board }}" in
            korvo-1)
              echo "defaults=sdkconfig.defaults;sdkconfig.defaults.korvo-1" >> "$GITHUB_OUTPUT"
              ;;
            function-coreboard-1|function-coreboard-1-spi-sd)
              echo "defaults=sdkconfig.defaults;sdkconfig.defaults.function-coreboard-1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown board" >&2
              exit 1
              ;;
          esac

      - name: Build loader for ${{ matrix.board }}
        run: |
          docker run --rm \
            -e BOARD="${{ matrix.board }}" \
            -e SDKCONFIG_DEFAULTS="${{ steps.board.outputs.defaults }}" \
            -v "$PWD":/work -w /work/bootloader \
            "$IDF_IMAGE" \
            bash -lc '
              set -euo pipefail
              . "${IDF_PATH}/export.sh"
              rm -f sdkconfig sdkconfig.old
              # esp32s31 is still a preview target in IDF 6.1.
              idf.py --preview \
                -D SDKCONFIG_DEFAULTS="$SDKCONFIG_DEFAULTS" \
                set-target esp32s31
              idf.py --preview -B ../build/bootloader \
                -D SDKCONFIG_DEFAULTS="$SDKCONFIG_DEFAULTS" \
                build
              ls -l ../build/bootloader/s31-linux-loader.bin \
                    ../build/bootloader/bootloader/bootloader.bin \
                    ../build/bootloader/partition_table/partition-table.bin
            '

      - name: Upload loader artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootloader-${{ matrix.board }}
          path: |
            build/bootloader/s31-linux-loader.bin
            build/bootloader/bootloader/bootloader.bin
            build/bootloader/partition_table/partition-table.bin
          if-no-files-found: error

  opensbi:
    name: OpenSBI
    runs-on: ubuntu-latest
    needs: board-check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build OpenSBI fw_jump
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            "$IDF_IMAGE" \
            bash -lc '
              set -euo pipefail
              . "${IDF_PATH}/export.sh"
              make opensbi CROSS_COMPILE=riscv32-esp-elf- GMAKE=make
              ls -l build/opensbi.bin build/opensbi.elf
            '

      - name: Upload OpenSBI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensbi
          path: |
            build/opensbi.bin
            build/opensbi.elf
          if-no-files-found: error

  rootfs:
    name: Rootfs (${{ matrix.board }})
    runs-on: ubuntu-latest
    needs: [board-check, kernel-check]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        board: [korvo-1, function-coreboard-1, function-coreboard-1-spi-sd]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Buildroot host image
        run: docker build -f container/Containerfile -t "$BR_IMAGE" container

      - name: Create Buildroot volume
        run: docker volume create "$BR_VOLUME"

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: /tmp/br-dl-cache
          key: br-dl-${{ hashFiles('br2-external/configs/*.defconfig', 'br2-external/board/**', 'linux/patches/**') }}
          restore-keys: br-dl-

      - name: Seed download cache into the volume
        run: |
          docker run --rm -v "$BR_VOLUME":/br -v /tmp/br-dl-cache:/cache \
            "$BR_IMAGE" bash -c '
              mkdir -p /br/dl /br/home /br/output
              if [ -d /cache ] && [ "$(ls -A /cache 2>/dev/null)" ]; then
                cp -a /cache/. /br/dl/
              fi
              chown -R '"$(id -u):$(id -g)"' /br
            '

      - name: Build SD rootfs for ${{ matrix.board }}
        run: make ci-rootfs BOARD=${{ matrix.board }}

      - name: Refresh download cache from the volume
        if: always()
        run: |
          mkdir -p /tmp/br-dl-cache
          docker run --rm -v "$BR_VOLUME":/br -v /tmp/br-dl-cache:/cache \
            "$BR_IMAGE" bash -c 'cp -a /br/dl/. /cache/ 2>/dev/null || true'

      - name: Upload rootfs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.board }}
          path: |
            build/Image
            build/linux.size
            build/initramfs.cpio
            build/buildroot/rootfs.ext2
            build/buildroot/sdcard.img
          if-no-files-found: error
          compression-level: 9
